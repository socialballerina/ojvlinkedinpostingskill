name: Deploy site to Vercel

# Deploys public/ and api/ to the linked Vercel project on every push to main,
# including the commits the fortnightly tranche bot makes. This exists because
# the Vercel project was linked with `vercel link` (CLI deploys) rather than the
# dashboard Git integration, so nothing was watching main.
#
# Needs one repository secret. Create a token at
# https://vercel.com/account/tokens then:
#
#   gh secret set VERCEL_TOKEN --repo socialballerina/ojvlinkedinpostingskill
#
# Without it this workflow skips with a notice instead of failing, so a push is
# never blocked by a missing secret.
#
# The two ids below are identifiers, not credentials. They are useless without
# the token and Vercel documents them as plain CI environment variables. They
# are hardcoded because .vercel/ is gitignored, so the workflow cannot read
# .vercel/project.json from the checkout.
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "api/**"
      - "vercel.json"
      - "package.json"
      - ".claude/skills/ojv-linkedin/library/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: ojv-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_ORG_ID: team_CNWU2LBg7PtMgy1xlJ6j8VGw
      VERCEL_PROJECT_ID: prj_Wr42nhM5m54qEGRschxVBxy42hA0
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Check the token is there
        id: gate
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=Vercel deploy skipped::No VERCEL_TOKEN secret on this repository. Create one at https://vercel.com/account/tokens then run: gh secret set VERCEL_TOKEN --repo ${{ github.repository }}"
            exit 0
          fi
          echo "go=yes" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: "20"

      - name: Rebuild the queue page from the library
        if: steps.gate.outputs.go == 'yes'
        run: |
          set -euo pipefail
          # The page is generated, never hand-edited, so rebuild it here rather
          # than trusting whatever is committed. If this changes the file, the
          # committed copy had drifted from the library and the deploy is the
          # one that is right.
          python3 .claude/skills/ojv-linkedin/scripts/build-queue-page.py public/queue.html
          if ! git diff --quiet -- public/queue.html; then
            echo "::warning title=queue.html was stale::The committed page did not match the library. Deploying the freshly built one. Run scripts/build-queue-page.py before committing next time."
          fi
          echo "public/queue.html is $(wc -c < public/queue.html) bytes"

      - name: Deploy
        if: steps.gate.outputs.go == 'yes'
        run: |
          set -euo pipefail
          npm install -g vercel@latest
          # `vercel pull` reads the project from the two ids above, so this needs
          # no dashboard step and no interactive login.
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $URL"
          {
            echo "### Site deployed"
            echo ""
            echo "Production: $URL"
            echo ""
            echo "Queue page: ${URL%/}/queue.html"
          } >> "$GITHUB_STEP_SUMMARY"
