name: Generate OJV week

# Triggered by the Vercel front end, or by hand from the Actions tab.
# Runs the real ojv-linkedin skill in Claude Code, billed to the Claude
# subscription behind CLAUDE_CODE_OAUTH_TOKEN. There is no Anthropic API key.
on:
  # Thursday 10:00 HKT, so next week's three drafts are ready before Monday even
  # if nobody presses the button. GitHub runs scheduled workflows from the
  # default branch only, and disables the schedule after 60 days of no activity
  # on a public repository.
  schedule:
    - cron: "0 2 * * 4"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Correlation id the front end polls for"
        required: true
        type: string
      ojv_news:
        description: "What OJV itself has done lately (archetype E has no other input)"
        required: false
        type: string
        default: ""
      keyword:
        description: "DM keyword for the offer"
        required: false
        type: string
        default: ""
      enquiry_url:
        description: "Enquiry destination"
        required: false
        type: string
        default: ""
      offer:
        description: "Current flagship offer"
        required: false
        type: string
        default: "China Tech Trek, Hong Kong and Shenzhen, 13 to 17 October 2026, run with ContraVC as official partner"
      dry_run:
        description: "Skip Claude and write a fake result, to test the pipeline"
        required: false
        type: boolean
        default: false

concurrency:
  group: ojv-week
  cancel-in-progress: false

# Only what the job actually does: commit the drafts it produced. The Claude Code
# GitHub App is not used, so no app-token exchange and no id-token permission.
permissions:
  contents: write

jobs:
  generate:
    # Set the repo variable OJV_RUNNER to 'self-hosted' to run on your own machine.
    #   gh variable set OJV_RUNNER --body self-hosted
    # Unset it, or set it to ubuntu-latest, to go back to GitHub's runners.
    runs-on: ${{ vars.OJV_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      RUN_ID: ${{ inputs.run_id || format('scheduled-{0}', github.run_id) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Say the run has started
        run: |
          set -euo pipefail
          python3 .github/scripts/marker.py start "$RUN_ID"
          .github/scripts/publish.sh "Run $RUN_ID: started"

      - name: Work out how Claude will authenticate
        id: auth
        if: ${{ inputs.dry_run != true }}
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Three ways in, tried in this order. Nothing here ever prints a value.
          #   1. ANTHROPIC_API_KEY secret          the documented path
          #   2. a local Claude Code login         only on a self-hosted runner
          #   3. CLAUDE_CODE_OAUTH_TOKEN secret    kept working, not required
          fail() {
            python3 .github/scripts/marker.py fail "$RUN_ID" "$1"
            .github/scripts/publish.sh "Run $RUN_ID: failed, $2"
            echo "::error::$2"
            exit 1
          }

          if [ -n "${API_KEY:-}" ]; then
            CLEAN=$(printf '%s' "$API_KEY" | tr -d '[:space:]')
            LEN=${#CLEAN}
            echo "Using the ANTHROPIC_API_KEY secret. Length: $LEN (raw ${#API_KEY})."
            if [ "${#API_KEY}" -ne "$LEN" ]; then
              echo "::warning::The secret contains whitespace. Using a trimmed copy."
            fi
            case "$CLEAN" in
              sk-ant-api*) : ;;
              sk-ant-oat01-*)
                fail "The ANTHROPIC_API_KEY secret holds a subscription OAuth token, not an API key. Either store it as CLAUDE_CODE_OAUTH_TOKEN instead, or create an API key at https://platform.claude.com and store that." \
                     "that secret is an OAuth token, not an API key" ;;
              *)
                fail "The ANTHROPIC_API_KEY secret does not look like a Claude API key: it should start with sk-ant-api. Create one at https://platform.claude.com, then: gh secret set ANTHROPIC_API_KEY --repo ${{ github.repository }}" \
                     "the secret does not start with sk-ant-api" ;;
            esac
            if [ "$LEN" -lt 80 ]; then
              fail "The ANTHROPIC_API_KEY secret is only $LEN characters. A real key is roughly 108. This is what a paste that stopped at a line break looks like. Copy the key with the copy button in the console, then: gh secret set ANTHROPIC_API_KEY --repo ${{ github.repository }}" \
                   "the key is $LEN characters, expected roughly 108, so it looks truncated"
            fi
            echo "method=api_key" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if command -v claude >/dev/null 2>&1 && claude auth status 2>/dev/null | grep -q '"loggedIn": *true'; then
            echo "No API key secret, but this machine's Claude Code is logged in. Using that."
            echo "method=local_login" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${OAUTH_TOKEN:-}" ]; then
            CLEAN=$(printf '%s' "$OAUTH_TOKEN" | tr -d '[:space:]')
            LEN=${#CLEAN}
            echo "No API key secret. Falling back to CLAUDE_CODE_OAUTH_TOKEN. Length: $LEN."
            case "$CLEAN" in
              sk-ant-oat01-*) : ;;
              *) fail "The CLAUDE_CODE_OAUTH_TOKEN secret does not start with sk-ant-oat01-." \
                      "the OAuth token is malformed" ;;
            esac
            if [ "$LEN" -lt 80 ]; then
              fail "The CLAUDE_CODE_OAUTH_TOKEN secret is only $LEN characters. A real one is roughly 130, and it wraps onto three lines in a terminal, so a paste that stops at the first newline leaves exactly 48. Set ANTHROPIC_API_KEY instead, which is the supported path for this workflow." \
                   "the OAuth token is $LEN characters, so it looks truncated"
            fi
            echo "method=oauth_token" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          fail "No way to authenticate Claude. Create an API key at https://platform.claude.com and store it: gh secret set ANTHROPIC_API_KEY --repo ${{ github.repository }}" \
               "no ANTHROPIC_API_KEY secret, no local login, no OAuth token"

      - name: Make sure Claude Code is available
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          if command -v claude >/dev/null 2>&1; then
            echo "Already installed: $(claude --version)"
          else
            npm install -g @anthropic-ai/claude-code
            claude --version
          fi

      - name: Build the prompt
        if: ${{ inputs.dry_run != true }}
        env:
          KEYWORD: ${{ inputs.keyword }}
          ENQUIRY_URL: ${{ inputs.enquiry_url }}
          OFFER: ${{ inputs.offer }}
          OJV_NEWS: ${{ inputs.ojv_news }}
        run: python3 .github/scripts/build-prompt.py

      - name: Run the skill in Claude Code
        id: claude
        if: ${{ inputs.dry_run != true }}
        continue-on-error: true
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          METHOD: ${{ steps.auth.outputs.method }}
        run: |
          set -euo pipefail
          # Trim, in case a secret was pasted with a trailing newline.
          case "$METHOD" in
            api_key)
              export ANTHROPIC_API_KEY="$(printf '%s' "$API_KEY" | tr -d '[:space:]')" ;;
            oauth_token)
              export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$OAUTH_TOKEN" | tr -d '[:space:]')" ;;
            local_login)
              echo "Using this machine's own Claude Code login." ;;
            *)
              echo "::error::The auth step did not choose a method."; exit 1 ;;
          esac
          echo "Auth method: $METHOD"
          claude -p "$(cat /tmp/ojv-prompt.txt)" \
            --allowed-tools "Read,Write,Edit,Bash,Glob,Grep,WebSearch,WebFetch" \
            --permission-mode acceptEdits \
            --max-turns 80 \
            2>&1 | tee /tmp/ojv-claude.log
          echo "Claude Code exited cleanly."

      - name: Show what Claude wrote
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          echo "--- files under runs/ ---"
          ls -la "runs/$RUN_ID" 2>/dev/null || echo "(nothing)"
          echo "--- last 40 lines of the Claude log ---"
          tail -40 /tmp/ojv-claude.log 2>/dev/null || echo "(no log)"

      - name: Write a dry-run result instead
        if: ${{ inputs.dry_run == true }}
        run: python3 .github/scripts/marker.py dry "$RUN_ID"

      - name: Work out why Claude did not run
        if: ${{ always() && steps.claude.outcome == 'failure' }}
        run: |
          set -euo pipefail
          # The commonest setup failure by far, and its error only appears in the log.
          python3 .github/scripts/marker.py fail "$RUN_ID" \
            "Claude Code ran but did not finish the week. The usual cause is an expired CLAUDE_CODE_OAUTH_TOKEN, or the subscription hitting a rate limit. Regenerate with claude setup-token and reset the secret. The workflow log holds the exact error. Nothing was generated."

      - name: Publish the result
        if: always()
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          python3 .github/scripts/marker.py finish "$RUN_ID"
          python3 .github/scripts/prune.py
          .github/scripts/publish.sh "Run $RUN_ID: $(python3 -c "import json;print(json.load(open('runs/$RUN_ID/status.json'))['state'])")"

      - name: Fail the job if the run did not produce posts
        if: always()
        run: |
          STATE=$(python3 -c "import json;print(json.load(open('runs/$RUN_ID/status.json'))['state'])")
          if [ "$STATE" != "done" ]; then
            python3 -c "import json;print('::error::'+json.load(open('runs/$RUN_ID/status.json')).get('error','The run failed.'))"
            exit 1
          fi
          echo "Run $RUN_ID finished with posts."
