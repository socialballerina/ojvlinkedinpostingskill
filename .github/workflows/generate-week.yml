name: Generate OJV week

# Triggered by the Vercel front end, or by hand from the Actions tab.
# Runs the real ojv-linkedin skill in Claude Code, billed to the Claude
# subscription behind CLAUDE_CODE_OAUTH_TOKEN. There is no Anthropic API key.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Correlation id the front end polls for"
        required: true
        type: string
      ojv_news:
        description: "What OJV itself has done lately (archetype E has no other input)"
        required: false
        type: string
        default: ""
      keyword:
        description: "DM keyword for the offer"
        required: false
        type: string
        default: ""
      enquiry_url:
        description: "Enquiry destination"
        required: false
        type: string
        default: ""
      offer:
        description: "Current flagship offer"
        required: false
        type: string
        default: "China Tech Trek, Hong Kong and Shenzhen, 13 to 17 October 2026, run with ContraVC as official partner"
      dry_run:
        description: "Skip Claude and write a fake result, to test the pipeline"
        required: false
        type: boolean
        default: false

concurrency:
  group: ojv-week
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_ID: ${{ inputs.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Say the run has started
        run: |
          set -euo pipefail
          python3 .github/scripts/marker.py start "$RUN_ID"
          .github/scripts/publish.sh "Run $RUN_ID: started"

      - name: Check the token is present
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            python3 .github/scripts/marker.py fail "$RUN_ID" \
              "Setup is not finished: the CLAUDE_CODE_OAUTH_TOKEN secret is missing on this repository. Run 'claude setup-token' on a machine with Claude Code, then 'gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo ${{ github.repository }}'. Nothing was generated."
            .github/scripts/publish.sh "Run $RUN_ID: failed, no Claude token"
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set on this repository."
            exit 1
          fi
          echo "Token is present."

      - name: Run the skill in Claude Code
        id: claude
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Write,Edit,Bash,Glob,Grep,WebSearch,WebFetch"
          prompt: |
            /ojv-linkedin

            Run the weekly run, all ten steps, for the next Monday, Wednesday and Friday.

            You are running headless in CI, so nobody can answer a question. Where the skill
            says to ask, record the request in needsFromAuthor and carry on with the rest.

            Config for this run, overriding the config table where a value is given:
            - DM keyword for tour enquiries: ${{ inputs.keyword }}
            - Enquiry destination: ${{ inputs.enquiry_url }}
            - Current flagship offer: ${{ inputs.offer }}
            - Raw image folder: not available in CI, so skip image intake entirely and pair
              only from assets/images/manifest.csv

            What OJV itself has done lately, the only valid input for archetype E:
            ${{ inputs.ojv_news }}

            If that is empty and you need archetype E, do not invent an OJV event. Say so in
            needsFromAuthor and use a different archetype for that slot.

            The skill directory is .claude/skills/ojv-linkedin/ and every relative path in
            SKILL.md is relative to it. Write drafts and update trackers there as normal.

            ALSO REQUIRED for this CI run. After the drafts and trackers are written, write
            runs/${{ inputs.run_id }}/result.json, relative to the repository root, with this
            exact shape:

            {
              "runId": "${{ inputs.run_id }}",
              "state": "done",
              "week": "YYYY-Www",
              "posts": [
                {
                  "postId": "...", "day": "Monday", "date": "YYYY-MM-DD",
                  "slot": "awareness", "archetype": "A", "archetypeName": "...",
                  "ctaTier": "soft", "hookPattern": "...",
                  "copy": "the finished post, real newlines",
                  "entities": ["..."], "sourceUrl": "...", "sourcePublisher": "...",
                  "firstComment": "", "disclosure": "",
                  "verified": true, "verificationNotes": "...",
                  "styleGate": [], "image": "", "altText": "",
                  "needsTeamPhoto": false, "photoBrief": "", "photoQuery": "",
                  "whyThisSlot": "", "blockers": [], "draftPath": "..."
                }
              ],
              "rotation": {"blockedArchetypes": [], "blockedEntities": [], "blockedHookPatterns": []},
              "needsFromAuthor": ["anything a person must supply or decide"],
              "notes": ""
            }

            Rules for that file:
            - needsTeamPhoto true whenever the post is about OJV, a partner or an OJV event, or
              whenever nothing in the manifest fits. Then photoBrief must name the shot:
              subject, setting, framing, and which partner should be in frame.
            - photoQuery only for a generic scene a licence-free stock photo could honestly
              carry. Never a person, a named company, a logo or a brand. Empty otherwise.
            - styleGate must be the real output of scripts/style-gate.py for that draft. Run it
              and fix what it reports before writing this file.
            - Valid JSON only. No trailing commas, no comments, no markdown fence.
            - Writing this file is not optional. Without it the run is reported as failed.

      - name: Write a dry-run result instead
        if: ${{ inputs.dry_run }}
        run: python3 .github/scripts/marker.py dry "$RUN_ID"

      - name: Publish the result
        if: always()
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          python3 .github/scripts/marker.py finish "$RUN_ID"
          python3 .github/scripts/prune.py
          .github/scripts/publish.sh "Run $RUN_ID: $(python3 -c "import json;print(json.load(open('runs/$RUN_ID/status.json'))['state'])")"

      - name: Fail the job if the run did not produce posts
        if: always()
        run: |
          STATE=$(python3 -c "import json;print(json.load(open('runs/$RUN_ID/status.json'))['state'])")
          if [ "$STATE" != "done" ]; then
            python3 -c "import json;print('::error::'+json.load(open('runs/$RUN_ID/status.json')).get('error','The run failed.'))"
            exit 1
          fi
          echo "Run $RUN_ID finished with posts."
