name: Generate OJV week

# Triggered by the Vercel front end, or by hand from the Actions tab.
# Runs the real ojv-linkedin skill in Claude Code, billed to the Claude
# subscription behind CLAUDE_CODE_OAUTH_TOKEN. There is no Anthropic API key.
on:
  # Thursday 10:00 HKT, so next week's three drafts are ready before Monday even
  # if nobody presses the button. GitHub runs scheduled workflows from the
  # default branch only, and disables the schedule after 60 days of no activity
  # on a public repository.
  schedule:
    - cron: "0 2 * * 4"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Correlation id the front end polls for"
        required: true
        type: string
      ojv_news:
        description: "What OJV itself has done lately (archetype E has no other input)"
        required: false
        type: string
        default: ""
      keyword:
        description: "DM keyword for the offer"
        required: false
        type: string
        default: ""
      enquiry_url:
        description: "Enquiry destination"
        required: false
        type: string
        default: ""
      offer:
        description: "Current flagship offer"
        required: false
        type: string
        default: "China Tech Trek, Hong Kong and Shenzhen, 13 to 17 October 2026, run with ContraVC as official partner"
      dry_run:
        description: "Skip Claude and write a fake result, to test the pipeline"
        required: false
        type: boolean
        default: false

concurrency:
  group: ojv-week
  cancel-in-progress: false

# Only what the job actually does: commit the drafts it produced. The Claude Code
# GitHub App is not used, so no app-token exchange and no id-token permission.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_ID: ${{ inputs.run_id || format('scheduled-{0}', github.run_id) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Say the run has started
        run: |
          set -euo pipefail
          python3 .github/scripts/marker.py start "$RUN_ID"
          .github/scripts/publish.sh "Run $RUN_ID: started"

      - name: Check the token
        if: ${{ inputs.dry_run != true }}
        env:
          TOK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${TOK:-}" ]; then
            python3 .github/scripts/marker.py fail "$RUN_ID" \
              "Setup is not finished: the CLAUDE_CODE_OAUTH_TOKEN secret is missing on this repository. Run 'claude setup-token' on a machine with Claude Code, then 'gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo ${{ github.repository }}'. Nothing was generated."
            .github/scripts/publish.sh "Run $RUN_ID: failed, no Claude token"
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set on this repository."
            exit 1
          fi
          # Shape check only. Nothing here prints the value.
          CLEAN=$(printf '%s' "$TOK" | tr -d '[:space:]')
          RAW_LEN=${#TOK}
          CLEAN_LEN=${#CLEAN}
          echo "Token length: $CLEAN_LEN (raw $RAW_LEN)."
          if [ "$RAW_LEN" -ne "$CLEAN_LEN" ]; then
            echo "::warning::The secret contains whitespace, probably a trailing newline from the paste. Using a trimmed copy."
          fi
          case "$CLEAN" in
            sk-ant-oat01-*) echo "Prefix looks like a subscription OAuth token." ;;
            sk-ant-api*)
              python3 .github/scripts/marker.py fail "$RUN_ID" \
                "The CLAUDE_CODE_OAUTH_TOKEN secret holds a Claude API key, not a subscription OAuth token. Run 'claude setup-token' and set the sk-ant-oat01-... value it prints."
              .github/scripts/publish.sh "Run $RUN_ID: failed, wrong token type"
              echo "::error::That secret is an API key, not an OAuth token."
              exit 1 ;;
            *)
              python3 .github/scripts/marker.py fail "$RUN_ID" \
                "The CLAUDE_CODE_OAUTH_TOKEN secret does not look like a subscription OAuth token: it should start with sk-ant-oat01-. Run 'claude setup-token' on a machine where 'claude' is logged in, and set exactly the value it prints."
              .github/scripts/publish.sh "Run $RUN_ID: failed, malformed token"
              echo "::error::The secret does not start with sk-ant-oat01-."
              exit 1 ;;
          esac
          # A real subscription token runs to roughly 100 characters. A value of about
          # 48 is the first line of a wrapped token, which is what a paste that stops at
          # the first newline produces.
          if [ "$CLEAN_LEN" -lt 80 ]; then
            python3 .github/scripts/marker.py fail "$RUN_ID" \
              "The CLAUDE_CODE_OAUTH_TOKEN secret is only $CLEAN_LEN characters. A real one is roughly 100. The token wraps onto three lines in a terminal, and a paste that stops at the first newline leaves exactly the first 48. Set it without a clipboard: claude setup-token | tr -d '[:space:]' | grep -o 'sk-ant-oat01-[A-Za-z0-9_-]*' | gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo ${{ github.repository }}"
            .github/scripts/publish.sh "Run $RUN_ID: failed, truncated token"
            echo "::error::The token is $CLEAN_LEN characters, expected roughly 100. It looks truncated at the first line break."
            exit 1
          fi

      - name: Install Claude Code
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Build the prompt
        if: ${{ inputs.dry_run != true }}
        env:
          KEYWORD: ${{ inputs.keyword }}
          ENQUIRY_URL: ${{ inputs.enquiry_url }}
          OFFER: ${{ inputs.offer }}
          OJV_NEWS: ${{ inputs.ojv_news }}
        run: python3 .github/scripts/build-prompt.py

      - name: Run the skill in Claude Code
        id: claude
        if: ${{ inputs.dry_run != true }}
        continue-on-error: true
        env:
          TOK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          # Trim, in case the secret was pasted with a trailing newline.
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$TOK" | tr -d '[:space:]')"
          claude -p "$(cat /tmp/ojv-prompt.txt)" \
            --allowed-tools "Read,Write,Edit,Bash,Glob,Grep,WebSearch,WebFetch" \
            --permission-mode acceptEdits \
            --max-turns 80 \
            2>&1 | tee /tmp/ojv-claude.log
          echo "Claude Code exited cleanly."

      - name: Show what Claude wrote
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          echo "--- files under runs/ ---"
          ls -la "runs/$RUN_ID" 2>/dev/null || echo "(nothing)"
          echo "--- last 40 lines of the Claude log ---"
          tail -40 /tmp/ojv-claude.log 2>/dev/null || echo "(no log)"

      - name: Write a dry-run result instead
        if: ${{ inputs.dry_run == true }}
        run: python3 .github/scripts/marker.py dry "$RUN_ID"

      - name: Work out why Claude did not run
        if: ${{ always() && steps.claude.outcome == 'failure' }}
        run: |
          set -euo pipefail
          # The commonest setup failure by far, and its error only appears in the log.
          python3 .github/scripts/marker.py fail "$RUN_ID" \
            "Claude Code ran but did not finish the week. The usual cause is an expired CLAUDE_CODE_OAUTH_TOKEN, or the subscription hitting a rate limit. Regenerate with claude setup-token and reset the secret. The workflow log holds the exact error. Nothing was generated."

      - name: Publish the result
        if: always()
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          python3 .github/scripts/marker.py finish "$RUN_ID"
          python3 .github/scripts/prune.py
          .github/scripts/publish.sh "Run $RUN_ID: $(python3 -c "import json;print(json.load(open('runs/$RUN_ID/status.json'))['state'])")"

      - name: Fail the job if the run did not produce posts
        if: always()
        run: |
          STATE=$(python3 -c "import json;print(json.load(open('runs/$RUN_ID/status.json'))['state'])")
          if [ "$STATE" != "done" ]; then
            python3 -c "import json;print('::error::'+json.load(open('runs/$RUN_ID/status.json')).get('error','The run failed.'))"
            exit 1
          fi
          echo "Run $RUN_ID finished with posts."
